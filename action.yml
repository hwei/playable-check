name: 'playable-check'
description: 'Validate an HTML5 playable ad package: static checks, headless container-API checks, and perf scoring'
inputs:
  zip:
    description: 'Path to the playable zip package (relative to the repo root)'
    required: true
  fail-on-warn:
    description: "Fail the job when any check warns (default 'false')"
    required: false
    default: 'false'
  skip-dynamic:
    description: "Skip headless-Chromium dynamic checks (default 'false')"
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm ci --prefix "${{ github.action_path }}"
      shell: bash
    - run: npx --prefix "${{ github.action_path }}" playwright install chromium --with-deps
      shell: bash
    - run: >
        node "${{ github.action_path }}/bin/playable-check.js"
        "${{ inputs.zip }}"
        ${{ inputs.fail-on-warn == 'true' && '--fail-on-warn' || '' }}
        ${{ inputs.skip-dynamic == 'true' && '--skip-dynamic' || '' }}
      shell: bash
